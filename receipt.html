<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Receipt - Mughal Restaurant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --purple:#4c00b0;--purple-dark:#36007d;--purple-deep:#25005a;--purple-mid:#6a1ec8;
      --purple-light:#f0e8ff;--gold:#f5c842;--gold-dark:#c9a227;--white:#ffffff;
      --cream:#f9f5ff;--text:#2a2a2a;--text-light:#666;--border:#e2d5f5;
      --shadow:rgba(76,0,176,0.18);--r:18px;--t:all 0.38s cubic-bezier(.4,0,.2,1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;color:var(--white);background:linear-gradient(135deg,var(--purple-deep),var(--purple),var(--purple-mid));min-height:100vh}
    .container{max-width:600px;margin:0 auto;padding:20px}
    
    /* Receipt Card */
    .receipt-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:32px;position:relative}
    .receipt-header{text-align:center;margin-bottom:32px;padding-bottom:24px;border-bottom:1px dashed rgba(255,255,255,.2)}
    .receipt-logo{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--gold);margin-bottom:8px}
    .receipt-address{font-size:.85rem;color:rgba(255,255,255,.6);margin-bottom:4px}
    .receipt-date{font-size:.75rem;color:rgba(255,255,255,.5);margin-top:12px}
    
    /* Order Status */
    .order-status{text-align:center;padding:24px;background:rgba(34,197,94,.1);border-radius:16px;margin-bottom:24px;transition:var(--t)}
    .status-icon{font-size:3.5rem;color:#22c55e;margin-bottom:12px}
    .status-text{font-size:1.3rem;font-weight:700;color:#22c55e}
    .status-sub{font-size:.9rem;color:rgba(255,255,255,.6);margin-top:6px}

    .order-status.pending{background:rgba(245,200,66,.15);border:2px solid var(--gold);animation:pendingPulse 2s ease-in-out infinite}
    @keyframes pendingPulse{
      0%,100%{opacity:1;box-shadow:0 0 20px rgba(245,200,66,.2)}
      50%{opacity:0.8;box-shadow:0 0 30px rgba(245,200,66,.4)}
    }
    .order-status.pending .status-icon{color:var(--gold);animation:iconSpin 2s linear infinite}
    @keyframes iconSpin{
      0%{transform:rotate(0deg)}
      100%{transform:rotate(360deg)}
    }
    .order-status.pending .status-text{color:var(--gold)}

    .order-status.confirmed{background:rgba(59,130,246,.15);border:2px solid #3b82f6;animation:confirmedPulse 1s ease-in-out}
    @keyframes confirmedPulse{
      0%{transform:scale(0.95);opacity:0.8}
      50%{transform:scale(1.02);opacity:1}
      100%{transform:scale(1);opacity:1}
    }
    .order-status.confirmed .status-icon{color:#3b82f6;animation:checkBounce 0.6s ease-out}
    @keyframes checkBounce{
      0%{transform:scale(0);opacity:0}
      50%{transform:scale(1.3);opacity:1}
      100%{transform:scale(1);opacity:1}
    }
    .order-status.confirmed .status-text{color:#3b82f6}

    .order-status.preparing{background:rgba(245,158,11,.15);border:2px solid #f59e0b;animation:preparingGlow 1.5s ease-in-out infinite}
    @keyframes preparingGlow{
      0%,100%{box-shadow:0 0 15px rgba(245,158,11,.2)}
      50%{box-shadow:0 0 25px rgba(245,158,11,.4)}
    }
    .order-status.preparing .status-icon{color:#f59e0b;animation:fireFlicker 0.5s ease-in-out infinite}
    @keyframes fireFlicker{
      0%,100%{transform:scale(1);opacity:1}
      50%{transform:scale(1.1);opacity:0.9}
    }
    .order-status.preparing .status-text{color:#f59e0b}

    .order-status.ready{background:rgba(34,197,94,.15);border:2px solid #22c55e;box-shadow:0 0 30px rgba(34,197,94,.4);animation:readyPop 0.8s ease-out}
    @keyframes readyPop{
      0%{transform:scale(0.9);opacity:0.8}
      50%{transform:scale(1.05);opacity:1}
      100%{transform:scale(1);opacity:1}
    }
    .order-status.ready .status-icon{color:#22c55e;animation:readyPulse 1s ease-in-out infinite}
    @keyframes readyPulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.1)}
    }
    .order-status.ready .status-text{color:#22c55e}

    .order-timer{background:rgba(245,200,66,.2);border:1px solid rgba(245,200,66,.4);border-radius:10px;padding:14px 20px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);font-size:1rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}

    /* Order Number Badge */
    .order-number-badge{text-align:center;padding:20px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border-radius:16px;margin-bottom:24px;box-shadow:0 8px 25px rgba(245,200,66,.3)}
    .order-number-label{font-size:.85rem;color:var(--purple-deep);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
    .order-number-value{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--purple-deep);letter-spacing:2px}
    
    /* Customer Info */
    .info-section{margin-bottom:24px}
    .info-title{font-size:.9rem;font-weight:600;color:var(--gold);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
    .info-row{display:flex;justify-content:space-between;padding:8px 0;font-size:.9rem}
    .info-label{color:rgba(255,255,255,.6)}
    .info-value{font-weight:500;color:var(--white)}
    
    /* Order Items */
    .items-section{margin-bottom:24px}
    .order-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
    .order-item:last-child{border-bottom:none}
    .order-item img{width:50px;height:50px;border-radius:8px;object-fit:cover}
    .order-item-info{flex:1}
    .order-item-name{font-size:.9rem;font-weight:600;color:var(--white)}
    .order-item-qty{font-size:.8rem;color:rgba(255,255,255,.5)}
    .order-item-price{font-size:.95rem;color:var(--gold);font-weight:600}
    
    /* Summary */
    .summary-row{display:flex;justify-content:space-between;padding:10px 0;font-size:.9rem;color:var(--white)}
    .summary-row.total{font-size:1.2rem;font-weight:700;color:var(--gold);border-top:1px solid rgba(255,255,255,.2);padding-top:16px;margin-top:8px}
    
    /* Map Buttons */
    .map-buttons{display:flex;gap:12px;margin-bottom:24px}
    .map-btn{flex:1;padding:14px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15);border-radius:10px;color:var(--white);font-size:.9rem;font-weight:500;cursor:pointer;transition:.3s;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
    .map-btn:hover{border-color:var(--gold)}
    .map-btn.google{color:#4285f4}
    .map-btn.apple{color:#fff}
    
    /* Call Button */
    .call-btn{width:100%;padding:16px;background:linear-gradient(135deg,#22c55e,#16a34a);border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:.3s;margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
    .call-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(34,197,94,.3)}
    
    /* Action Buttons */
    .action-buttons{display:flex;gap:12px}
    .action-btn{flex:1;padding:16px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15);border-radius:12px;color:var(--white);font-size:1rem;font-weight:600;cursor:pointer;transition:.3s;text-decoration:none;text-align:center}
    .action-btn:hover{border-color:var(--gold)}
    .action-btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);border:none}
    .action-btn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(245,200,66,.3)}
    
    /* Toast */
    .toast{position:fixed;top:30px;right:30px;z-index:9999;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:13px 20px;border-radius:14px;font-size:.85rem;font-weight:600;box-shadow:0 12px 38px rgba(34,197,94,.4);opacity:0;transform:translateX(18px);transition:all .42s cubic-bezier(.4,0,.2,1);pointer-events:none;max-width:300px}
    .toast.show{opacity:1;transform:translateX(0);pointer-events:all}
    .toast.error{background:linear-gradient(135deg,#c0392b,#e74c3c);box-shadow:0 12px 38px rgba(239,68,68,.4)}
    
    @media print{
      .action-buttons,.map-buttons,.call-btn{display:none}
      .receipt-card{box-shadow:none;border:none}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="receipt-card" id="receiptCard">
      <div class="receipt-header">
        <div class="receipt-logo">RAVINTOLA MUGHAL</div>
        <div class="receipt-address">Aallonhalkoja 3, Helsinki</div>
        <div class="receipt-address" id="orderDate"></div>
      </div>

      <!-- Order Number Badge -->
      <div class="order-number-badge">
        <div class="order-number-label">Order Number</div>
        <div class="order-number-value" id="orderNumber">MUGHAL001</div>
      </div>

      <!-- Order Status -->
      <div class="order-status pending" id="orderStatus">
        <i class="fas fa-clock status-icon"></i>
        <div class="status-text">Please Wait</div>
        <div class="status-sub">Confirming your order...</div>
      </div>

      <!-- Order Items -->
      <div class="items-section">
        <div class="info-title">Order Items</div>
        <div id="orderItems"></div>
      </div>

      <!-- Order Summary -->
      <div class="info-section">
        <div class="info-title">Order Summary</div>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal"></span>
        </div>
        <div class="summary-row">
          <span>Discount</span>
          <span id="discount"></span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="total"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Pickup Time</span>
          <span class="info-value" id="pickupTime"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Payment Method</span>
          <span class="info-value" id="paymentMethod"></span>
        </div>
      </div>

      <!-- Customer Information -->
      <div class="info-section">
        <div class="info-title">Customer Information</div>
        <div class="info-row">
          <span class="info-label">Name</span>
          <span class="info-value" id="customerName"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Phone</span>
          <span class="info-value" id="customerPhone"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Email</span>
          <span class="info-value" id="customerEmail"></span>
        </div>
      </div>

      <div class="map-buttons">
        <a href="https://www.google.com/maps/search/?api=1&query=Aallonhalkoja+3+Helsinki" target="_blank" class="map-btn google">
          <i class="fab fa-google"></i> Google Maps
        </a>
        <a href="https://maps.apple.com/?address=Aallonhalkoja+3,Helsinki" target="_blank" class="map-btn apple">
          <i class="fab fa-apple"></i> Apple Maps
        </a>
      </div>

      <a href="tel:+358458527515" class="call-btn">
        <i class="fas fa-phone"></i> Call Restaurant
      </a>

      <div class="action-buttons">
        <button class="action-btn" onclick="saveReceiptAsPhoto()">
          <i class="fas fa-camera"></i> Save Receipt
        </button>
        <a href="food-ordering.html" class="action-btn primary">
          <i class="fas fa-check"></i> Done
        </a>
      </div>

      <div style="margin-top:24px;text-align:center">
        <a href="#" onclick="openTrackOrder()" style="color:var(--gold);text-decoration:none;font-size:.9rem;font-weight:500">
          <i class="fas fa-truck"></i> Track Order
        </a>
      </div>
    </div>
  </div>
  
  <!-- Toast -->
  <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Success!</span></div>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  
  <script>
    // Firebase Config
    const firebaseConfig={
      apiKey:"AIzaSyAmimDsjW_pF2NGw-w-40QzTsgmf1tdqyI",
      authDomain:"bdmsalonappointment.firebaseapp.com",
      databaseURL:"https://bdmsalonappointment-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:"bdmsalonappointment",
      storageBucket:"bdmsalonappointment.firebasestorage.app",
      messagingSenderId:"123933913893",
      appId:"1:123933913893:web:c1f57caf4dc2a5440ba0cc"
    };
    firebase.initializeApp(firebaseConfig);
    const db=firebase.database();
    
    let orderData=null;
    let orderCounter=0;

    // Format order number as MUGHAL001, MUGHAL002, etc.
    function formatOrderNumber(orderId){
      const numericId=orderId.replace(/\D/g,'')||'1';
      const paddedId=numericId.padStart(3,'0');
      return 'MUGHAL'+paddedId;
    }

    // Load order data
    function loadOrderData(){
      const urlParams=new URLSearchParams(window.location.search);
      const orderId=urlParams.get('orderId');

      if(!orderId){
        showToast('Order ID not found',true);
        setTimeout(()=>window.location.href='food-ordering.html',2000);
        return;
      }

      db.ref('orders/'+orderId).on('value',(snapshot)=>{
        orderData=snapshot.val();
        if(!orderData){
          showToast('Order not found',true);
          setTimeout(()=>window.location.href='food-ordering.html',2000);
          return;
        }
        renderReceipt();
      }).catch((error)=>{
        showToast('Error loading order',true);
        console.error(error);
      });
    }

    // Render receipt
    function renderReceipt(){
      const formattedOrderNumber=formatOrderNumber(orderData.id);
      document.getElementById('orderNumber').textContent=formattedOrderNumber;
      document.getElementById('orderDate').textContent=new Date(orderData.createdAt).toLocaleString();
      document.getElementById('pickupTime').textContent=orderData.preorder?orderData.pickupTime:'ASAP';
      document.getElementById('paymentMethod').textContent=orderData.paymentMethod.charAt(0).toUpperCase()+orderData.paymentMethod.slice(1);
      document.getElementById('customerName').textContent=orderData.customer.name;
      document.getElementById('customerPhone').textContent=orderData.customer.phone;
      document.getElementById('customerEmail').textContent=orderData.customer.email;
      document.getElementById('subtotal').textContent='€'+orderData.subtotal.toFixed(2);
      document.getElementById('discount').textContent='€'+orderData.discount.toFixed(2);
      document.getElementById('total').textContent='€'+orderData.total.toFixed(2);

      // Render items
      const itemsHtml=orderData.items.map(item=>`
        <div class="order-item">
          <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/50'"/>
          <div class="order-item-info">
            <div class="order-item-name">${item.name}</div>
            <div class="order-item-qty">x${item.quantity}</div>
          </div>
          <div class="order-item-price">€${((parseFloat(item.price)||0)*item.quantity).toFixed(2)}</div>
        </div>
      `).join('');
      document.getElementById('orderItems').innerHTML=itemsHtml;

      // Update status
      updateOrderStatus(orderData.status);
    }
    
    // Update order status
    function updateOrderStatus(status){
      const statusEl=document.getElementById('orderStatus');
      statusEl.className='order-status '+status;

      let icon,text,sub;
      switch(status){
        case 'pending':
          icon='fa-clock';
          text='Please Wait';
          sub='Confirming your order...';
          break;
        case 'confirmed':
          icon='fa-check-circle';
          text='Order Confirmed';
          sub='Your order has been confirmed and is being prepared';
          break;
        case 'preparing':
          icon='fa-fire';
          text='Preparing';
          sub='Your food is being prepared with care';
          break;
        case 'ready':
          icon='fa-utensils';
          text='Ready for Pickup';
          sub='Your order is ready to collect';
          break;
        case 'delivered':
          icon='fa-check-double';
          text='Completed';
          sub='Thank you for your order!';
          break;
        default:
          icon='fa-clock';
          text='Please Wait';
          sub='Confirming your order...';
      }

      statusEl.querySelector('.status-icon').className='fas '+icon+' status-icon';
      statusEl.querySelector('.status-text').textContent=text;
      statusEl.querySelector('.status-sub').textContent=sub;

      // Update timer - start when confirmed
      const showTimer=(status==='confirmed'||status==='preparing')&&orderData.estimatedTime&&orderData.estimatedSetAt;
      let timerEl=document.getElementById('orderTimer');
      if(!timerEl&&showTimer){
        timerEl=document.createElement('div');
        timerEl.id='orderTimer';
        timerEl.className='order-timer';
        timerEl.innerHTML='<i class="fas fa-clock"></i><span id="timerDisplay"></span>';
        statusEl.appendChild(timerEl);
        startOrderTimer();
      }else if(timerEl&&!showTimer){
        timerEl.remove();
      }
    }
    
    // Start order timer
    function startOrderTimer(){
      if(!orderData.estimatedTime||!orderData.estimatedSetAt)return;
      
      const updateTimer=()=>{
        const elapsedMs=Date.now()-orderData.estimatedSetAt;
        const remainingMs=(orderData.estimatedTime*60*1000)-elapsedMs;
        const remainingMinutes=Math.max(0,Math.ceil(remainingMs/60000));
        
        const timerDisplay=document.getElementById('timerDisplay');
        if(timerDisplay){
          timerDisplay.textContent=`Est. ${remainingMinutes} min`;
        }
      };
      
      updateTimer();
      setInterval(updateTimer,60000);
    }
    
    // Listen to order status changes
    function listenOrderStatus(orderId){
      db.ref('orders/'+orderId+'/status').on('value',(snapshot)=>{
        const status=snapshot.val();
        if(status&&orderData.status!==status){
          orderData.status=status;
          updateOrderStatus(status);
        }
      });
    }
    
    // Save receipt as photo
    function saveReceiptAsPhoto(){
      const receiptCard=document.getElementById('receiptCard');
      const container=document.querySelector('.container');

      // Capture the full receipt as shown on screen
      html2canvas(receiptCard,{
        scale:2,
        backgroundColor:null,
        useCORS:true,
        logging:false
      }).then((canvas)=>{
        const link=document.createElement('a');
        const formattedOrderNumber=formatOrderNumber(orderData.id);
        link.download='Mughal_Receipt_'+formattedOrderNumber+'.png';
        link.href=canvas.toDataURL('image/png');
        link.click();
        showToast('Receipt saved as photo');
      }).catch((error)=>{
        showToast('Failed to save receipt',true);
        console.error(error);
      });
    }
    
    // Open track order
    function openTrackOrder(){
      showToast('Track order feature coming soon');
    }
    
    // Toast
    function showToast(msg,isError=false){
      const toast=document.getElementById('toast');
      document.getElementById('toastMsg').textContent=msg;
      toast.classList.toggle('error',isError);
      toast.querySelector('i').className=isError?'fas fa-exclamation-circle':'fas fa-check-circle';
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'),3500);
    }
    
    loadOrderData();
  </script>
</body>
</html>
