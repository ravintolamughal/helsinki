<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Orders - Mughal Restaurant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --purple:#4c00b0;--purple-dark:#36007d;--purple-deep:#25005a;--purple-mid:#6a1ec8;
      --purple-light:#f0e8ff;--gold:#f5c842;--gold-dark:#c9a227;--white:#ffffff;
      --cream:#f9f5ff;--text:#2a2a2a;--text-light:#666;--border:#e2d5f5;
      --shadow:rgba(76,0,176,0.18);--r:18px;--t:all 0.38s cubic-bezier(.4,0,.2,1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;color:var(--text);background:linear-gradient(135deg,var(--purple-deep),var(--purple),var(--purple-mid));min-height:100vh;overflow-x:hidden}
    
    /* Navbar */
    .navbar{background:rgba(37,0,90,.95);backdrop-filter:blur(20px);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
    .nav-logo{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--gold)}
    .nav-links{display:flex;gap:20px}
    .nav-links a{color:rgba(255,255,255,.85);text-decoration:none;font-size:.9rem;transition:.3s}
    .nav-links a:hover{color:var(--gold)}
    
    /* Container */
    .container{max-width:1600px;margin:0 auto;padding:24px;display:flex;gap:24px}
    
    /* Sidebar */
    .sidebar{width:250px;flex-shrink:0}
    .sidebar-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--gold);margin-bottom:20px}
    .sidebar-tabs{display:flex;flex-direction:column;gap:8px}
    .sidebar-tab{padding:16px 20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:rgba(255,255,255,.7);font-size:.95rem;font-weight:600;cursor:pointer;transition:.3s;text-align:left;font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:12px}
    .sidebar-tab:hover{background:rgba(255,255,255,.1);color:var(--white)}
    .sidebar-tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);border-color:var(--gold)}
    .sidebar-tab i{width:20px;text-align:center}
    .tab-badge{margin-left:auto;background:rgba(0,0,0,.2);padding:2px 8px;border-radius:10px;font-size:.8rem}
    
    /* Main Content */
    .main-content{flex:1}
    .section-title{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--gold);margin-bottom:24px}
    .orders-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px}
    
    @media(max-width:1400px){
      .orders-grid{grid-template-columns:repeat(3,1fr)}
    }
    @media(max-width:1100px){
      .container{flex-direction:column}
      .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding-bottom:10px}
      .sidebar-tabs{flex-direction:row;flex-wrap:nowrap}
      .sidebar-tab{flex-shrink:0}
      .orders-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:768px){
      .orders-grid{grid-template-columns:1fr}
    }
    
    /* Order Card */
    .order-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;transition:var(--t);min-height:280px;display:flex;flex-direction:column}
    .order-card.new-order{border:2px solid var(--gold);background:rgba(245,200,66,.08)}
    .order-card.preorder{border:2px solid #3b82f6;background:rgba(59,130,246,.08)}
    .order-card:hover{transform:translateY(-3px)}
    .order-card.expanded{min-height:auto}
    
    /* Order Header */
    .order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1)}
    .order-number{font-size:1.1rem;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif}
    .order-time{font-size:.8rem;color:rgba(255,255,255,.6)}
    .order-status{padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:600}
    .order-status.pending{background:rgba(245,200,66,.2);color:var(--gold)}
    .order-status.confirmed{background:rgba(59,130,246,.2);color:#3b82f6}
    .order-status.preparing{background:rgba(245,158,11,.2);color:#f59e0b}
    .order-status.ready{background:rgba(34,197,94,.2);color:#22c55e}
    
    /* Customer Info */
    .customer-info{margin-bottom:16px}
    .customer-name{font-size:1rem;font-weight:600;color:var(--white);margin-bottom:4px}
    .customer-contact{font-size:.85rem;color:rgba(255,255,255,.6);margin-bottom:2px}
    .customer-contact i{margin-right:6px;color:var(--gold);width:14px}
    
    /* Preorder Badge */
    .preorder-badge{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;padding:6px 12px;border-radius:8px;font-size:.75rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
    .preorder-badge i{font-size:.9rem}
    .preorder-time{font-size:.9rem;color:#3b82f6;font-weight:600;margin-top:4px}
    
    /* Order Items */
    .order-items{flex:1;margin-bottom:16px}
    .order-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
    .order-item:last-child{border-bottom:none}
    .item-qty{background:var(--gold);color:var(--purple-deep);width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
    .item-name{flex:1;font-size:.85rem;color:var(--white)}
    .item-price{font-size:.85rem;color:var(--gold);font-weight:600}
    
    /* View More */
    .view-more{color:var(--gold);font-size:.85rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;margin-top:8px;transition:.3s}
    .view-more:hover{color:var(--gold-dark)}
    .view-more i{transition:.3s}
    .view-more.expanded i{transform:rotate(180deg)}
    
    /* Order Notes */
    .order-notes{background:rgba(255,255,255,.05);border-radius:8px;padding:12px;margin-top:12px;display:none}
    .order-notes.show{display:block}
    .note-item{font-size:.8rem;color:rgba(255,255,255,.7);margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.05)}
    .note-item:last-child{border-bottom:none}
    .note-item strong{color:var(--gold)}
    
    /* Order Total */
    .order-total{display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);font-weight:600;color:var(--white)}
    .total-label{font-size:.9rem}
    .total-amount{font-size:1.1rem;color:var(--gold)}
    
    /* Order Actions */
    .order-actions{display:flex;gap:8px;margin-top:16px}
    .action-btn{flex:1;padding:12px;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;transition:.3s;border:none;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Poppins',sans-serif}
    .btn-accept{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
    .btn-accept:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(34,197,94,.3)}
    .btn-ready{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
    .btn-ready:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,.3)}
    .btn-complete{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
    .btn-complete:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(245,158,11,.3)}
    .btn-cancel{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
    .btn-cancel:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(239,68,68,.3)}
    .btn-view{background:rgba(255,255,255,.1);color:var(--white);border:1px solid rgba(255,255,255,.2)}
    .btn-view:hover{background:rgba(255,255,255,.15);border-color:var(--gold)}
    
    /* New Order Notification */
    .new-order-modal{position:fixed;inset:0;background:linear-gradient(135deg,var(--purple-deep),var(--purple));z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
    .new-order-modal.show{display:flex;animation:slideIn 0.5s ease}
    @keyframes slideIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
    .new-order-content{background:rgba(255,255,255,.1);backdrop-filter:blur(20px);border:2px solid var(--gold);border-radius:24px;padding:40px;max-width:500px;width:100%;text-align:center}
    .new-order-icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;color:var(--purple-deep);font-size:2.5rem;margin:0 auto 20px;animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
    .new-order-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--gold);margin-bottom:12px}
    .new-order-text{color:rgba(255,255,255,.8);font-size:1.1rem;margin-bottom:24px}
    .new-order-details{background:rgba(255,255,255,.05);border-radius:12px;padding:20px;margin-bottom:24px;text-align:left}
    .new-order-details p{color:rgba(255,255,255,.8);margin-bottom:8px;font-size:.95rem}
    .new-order-details strong{color:var(--gold)}
    .new-order-btn{padding:18px 40px;background:linear-gradient(135deg,#22c55e,#16a34a);border:none;border-radius:14px;color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;transition:.3s;font-family:'Poppins',sans-serif}
    .new-order-btn:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(34,197,94,.4)}
    
    /* Time Selection Modal */
    .time-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9998;display:none;align-items:center;justify-content:center;padding:20px}
    .time-modal.show{display:flex}
    .time-modal-content{background:linear-gradient(135deg,var(--purple-deep),var(--purple));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;max-width:450px;width:100%}
    .time-modal-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--gold);margin-bottom:20px;text-align:center}
    .time-options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
    .time-option{padding:16px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15);border-radius:12px;text-align:center;cursor:pointer;transition:.3s}
    .time-option:hover{border-color:var(--gold);background:rgba(245,200,66,.1)}
    .time-option.selected{border-color:var(--gold);background:rgba(245,200,66,.15)}
    .time-option span{display:block;color:var(--white);font-weight:600;font-size:1.1rem}
    .time-option small{color:rgba(255,255,255,.5);font-size:.8rem;margin-top:4px;display:block}
    .custom-time{display:flex;gap:8px;margin-bottom:24px}
    .custom-time input{flex:1;padding:12px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15);border-radius:10px;color:var(--white);font-size:1rem;text-align:center;font-family:'Poppins',sans-serif}
    .custom-time input:focus{border-color:var(--gold);outline:none}
    .time-modal-actions{display:flex;gap:12px}
    .time-modal-btn{flex:1;padding:14px;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.3s;border:none;font-family:'Poppins',sans-serif}
    .btn-cancel{background:rgba(255,255,255,.1);color:var(--white)}
    .btn-confirm{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
    .btn-confirm:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(34,197,94,.3)}
    
    /* Toast */
    .toast{position:fixed;top:30px;right:30px;z-index:99999;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:13px 20px;border-radius:14px;font-size:.85rem;font-weight:600;box-shadow:0 12px 38px rgba(34,197,94,.4);opacity:0;transform:translateX(18px);transition:all .42s cubic-bezier(.4,0,.2,1);pointer-events:none;max-width:300px}
    .toast.show{opacity:1;transform:translateX(0);pointer-events:all}
    .toast.error{background:linear-gradient(135deg,#c0392b,#e74c3c);box-shadow:0 12px 38px rgba(239,68,68,.4)}
    
    /* Empty State */
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.5)}
    .empty-state i{font-size:4rem;margin-bottom:16px;opacity:.5}
    .empty-state p{font-size:1rem}
    
    @media(max-width:768px){
      .orders-grid{grid-template-columns:1fr}
      .navbar{padding:12px 20px}
      .time-options{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-logo">Mughal Admin</div>
    <div class="nav-links">
      <a href="menusetup.html">Menu Setup</a>
      <a href="adminorders.html" style="color:var(--gold)">Orders</a>
      <a href="index.html">View Site</a>
    </div>
  </nav>
  
  <!-- Container -->
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h2 class="sidebar-title">Orders</h2>
      <div class="sidebar-tabs">
        <div class="sidebar-tab active" onclick="switchTab('pending')" id="tab-pending">
          <i class="fas fa-clock"></i>
          Pending
          <span class="tab-badge" id="pendingBadge">0</span>
        </div>
        <div class="sidebar-tab" onclick="switchTab('confirmed')" id="tab-confirmed">
          <i class="fas fa-utensils"></i>
          Confirmed
          <span class="tab-badge" id="confirmedBadge">0</span>
        </div>
        <div class="sidebar-tab" onclick="switchTab('preparing')" id="tab-preparing">
          <i class="fas fa-fire"></i>
          Preparing
          <span class="tab-badge" id="preparingBadge">0</span>
        </div>
        <div class="sidebar-tab" onclick="switchTab('ready')" id="tab-ready">
          <i class="fas fa-check-circle"></i>
          Ready
          <span class="tab-badge" id="readyBadge">0</span>
        </div>
        <div class="sidebar-tab" onclick="switchTab('delivered')" id="tab-delivered">
          <i class="fas fa-check-double"></i>
          Completed
          <span class="tab-badge" id="deliveredBadge">0</span>
        </div>
        <div class="sidebar-tab" onclick="switchTab('rejected')" id="tab-rejected">
          <i class="fas fa-times-circle"></i>
          Cancelled
          <span class="tab-badge" id="rejectedBadge">0</span>
        </div>
      </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
      <h2 class="section-title" id="sectionTitle">Pending Orders</h2>
      <div class="orders-grid" id="ordersContainer">
        <div class="empty-state">
          <i class="fas fa-inbox"></i>
          <p>No orders</p>
        </div>
      </div>
    </div>
  </div>
  
  <!-- New Order Notification Modal -->
  <div class="new-order-modal" id="newOrderModal">
    <div class="new-order-content">
      <div class="new-order-icon"><i class="fas fa-bell"></i></div>
      <h2 class="new-order-title">New Order!</h2>
      <p class="new-order-text">Order #<span id="newOrderNumber"></span> has arrived</p>
      <div class="new-order-details">
        <p><strong>Customer:</strong> <span id="newOrderCustomer"></span></p>
        <p><strong>Items:</strong> <span id="newOrderItems"></span></p>
        <p><strong>Total:</strong> <span id="newOrderTotal"></span></p>
      </div>
      <button class="new-order-btn" onclick="acceptNewOrder()">Accept Order</button>
    </div>
  </div>
  
  <!-- Time Selection Modal -->
  <div class="time-modal" id="timeModal">
    <div class="time-modal-content">
      <h3 class="time-modal-title">Select Preparation Time</h3>
      <div class="time-options">
        <div class="time-option selected" onclick="selectTime(15)">
          <span>15</span>
          <small>minutes</small>
        </div>
        <div class="time-option" onclick="selectTime(25)">
          <span>25</span>
          <small>minutes</small>
        </div>
        <div class="time-option" onclick="selectTime(35)">
          <span>35</span>
          <small>minutes</small>
        </div>
        <div class="time-option" onclick="selectTime(45)">
          <span>45</span>
          <small>minutes</small>
        </div>
        <div class="time-option" onclick="selectTime(60)">
          <span>60</span>
          <small>minutes</small>
        </div>
      </div>
      <div class="custom-time">
        <input type="number" id="customTimeInput" placeholder="Or enter minutes (max 60)" min="1" max="60" oninput="validateCustomTime()"/>
      </div>
      <div class="time-modal-actions">
        <button class="time-modal-btn btn-cancel" onclick="closeTimeModal()">Cancel</button>
        <button class="time-modal-btn btn-confirm" onclick="confirmTime()">Confirm</button>
      </div>
    </div>
  </div>
  
  <!-- Toast -->
  <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Success!</span></div>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    // Firebase Config
    const firebaseConfig={
      apiKey:"AIzaSyAmimDsjW_pF2NGw-w-40QzTsgmf1tdqyI",
      authDomain:"bdmsalonappointment.firebaseapp.com",
      databaseURL:"https://bdmsalonappointment-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:"bdmsalonappointment",
      storageBucket:"bdmsalonappointment.firebasestorage.app",
      messagingSenderId:"123933913893",
      appId:"1:123933913893:web:c1f57caf4dc2a5440ba0cc"
    };
    firebase.initializeApp(firebaseConfig);
    const db=firebase.database();
    
    let currentNewOrderId=null;
    let selectedTime=15;
    let ordersRef=null;
    let processedOrders=new Set();
    let currentTab='pending';
    
    // Listen for orders
    document.addEventListener('DOMContentLoaded',()=>{
      loadOrders();
      ordersRef=db.ref('orders').on('value',(snapshot)=>{
        const data=snapshot.val();
        if(data){
          Object.entries(data).forEach(([id,order])=>{
            if(order.status==='pending'&&!processedOrders.has(id)){
              showNewOrderModal(id,order);
              processedOrders.add(id);
            }
          });
        }
        loadOrders();
      });
    });
    
    // Switch tab
    function switchTab(tab){
      currentTab=tab;
      document.querySelectorAll('.sidebar-tab').forEach(t=>t.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      
      const titles={
        pending:'Pending Orders',
        confirmed:'Confirmed Orders',
        preparing:'Preparing Orders',
        ready:'Ready Orders',
        delivered:'Completed Orders',
        rejected:'Cancelled Orders'
      };
      document.getElementById('sectionTitle').textContent=titles[tab];
      
      loadOrders();
    }
    
    // Load orders
    function loadOrders(){
      console.log('Loading orders from Firebase...');
      db.ref('orders').once('value').then((snapshot)=>{
        const data=snapshot.val();
        console.log('Orders data:', data);
        if(!data){
          document.getElementById('ordersContainer').innerHTML='<div class="empty-state"><i class="fas fa-inbox"></i><p>No orders</p></div>';
          updateBadges({});
          return;
        }
        
        const ordersByStatus={
          pending:[],
          confirmed:[],
          preparing:[],
          ready:[],
          delivered:[],
          rejected:[]
        };
        
        Object.entries(data).forEach(([id,order])=>{
          if(ordersByStatus[order.status]){
            ordersByStatus[order.status].push({id,...order});
          }
        });
        
        updateBadges(ordersByStatus);
        renderOrders(ordersByStatus[currentTab]);
      });
    }
    
    // Update badges
    function updateBadges(ordersByStatus){
      document.getElementById('pendingBadge').textContent=ordersByStatus.pending?.length||0;
      document.getElementById('confirmedBadge').textContent=ordersByStatus.confirmed?.length||0;
      document.getElementById('preparingBadge').textContent=ordersByStatus.preparing?.length||0;
      document.getElementById('readyBadge').textContent=ordersByStatus.ready?.length||0;
      document.getElementById('deliveredBadge').textContent=ordersByStatus.delivered?.length||0;
      document.getElementById('rejectedBadge').textContent=ordersByStatus.rejected?.length||0;
    }
    
    // Render orders
    function renderOrders(orders){
      const container=document.getElementById('ordersContainer');
      console.log('Rendering orders:', orders);
      if(!orders||orders.length===0){
        container.innerHTML='<div class="empty-state"><i class="fas fa-inbox"></i><p>No orders</p></div>';
        return;
      }
      
      try{
        const cardsHtml=orders.map(order=>createOrderCard(order)).join('');
        console.log('Cards HTML generated:', cardsHtml.substring(0,200));
        container.innerHTML=cardsHtml;
      }catch(error){
        console.error('Error rendering orders:', error);
        container.innerHTML='<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading orders</p></div>';
      }
    }
    
    // Create order card
    function createOrderCard(order){
      const itemsToShow=order.items.slice(0,3);
      const hasMoreItems=order.items.length>3;
      const isPreorder=order.preorder;
      const orderId=order.id.replace('order_','');
      const orderDate=new Date(order.timestamp||Date.now());
      
      return `
        <div class="order-card ${order.status==='pending'?'new-order':''} ${isPreorder?'preorder':''}" id="card_${order.id}">
          <div class="order-header">
            <span class="order-number">#${orderId}</span>
            <span class="order-status ${order.status}">${order.status.charAt(0).toUpperCase()+order.status.slice(1)}</span>
          </div>
          <p class="order-time">${orderDate.toLocaleDateString()} ${orderDate.toLocaleTimeString()}</p>
          
          ${isPreorder?`
            <div class="preorder-badge">
              <i class="fas fa-clock"></i> Preorder
            </div>
            <p class="preorder-time"><i class="fas fa-calendar"></i> Pickup: ${order.pickupTime}</p>
          `:''}
          
          <div class="customer-info">
            <p class="customer-name">${order.customer.name}</p>
            <p class="customer-contact"><i class="fas fa-phone"></i> ${order.customer.phone}</p>
            <p class="customer-contact"><i class="fas fa-envelope"></i> ${order.customer.email}</p>
          </div>
          
          <div class="order-items" id="items_${order.id}">
            ${itemsToShow.map(item=>`
              <div class="order-item">
                <span class="item-qty">${item.quantity}</span>
                <span class="item-name">${item.name}</span>
                <span class="item-price">€${item.price.toFixed(2)}</span>
              </div>
            `).join('')}
          </div>
          
          ${hasMoreItems?`
            <div class="view-more" onclick="toggleViewMore('${order.id}',${order.items.length})">
              <span id="viewMoreText_${order.id}">View ${order.items.length-3} more items</span>
              <i class="fas fa-chevron-down" id="viewMoreIcon_${order.id}"></i>
            </div>
          `:''}
          
          <div class="order-notes" id="notes_${order.id}">
            ${order.items.map(item=>`
              ${item.note?`<div class="note-item"><strong>${item.name}:</strong> ${item.note}</div>`:''}
            `).join('')}
          </div>
          
          <div class="order-total">
            <span class="total-label">Total</span>
            <span class="total-amount">€${order.total.toFixed(2)}</span>
          </div>
          
          <div class="order-actions">
            ${order.status==='pending'?`
              <button class="action-btn btn-accept" onclick="openTimeModal('${order.id}')">
                <i class="fas fa-check"></i> Accept
              </button>
              <button class="action-btn btn-cancel" onclick="cancelOrder('${order.id}')">
                <i class="fas fa-times"></i> Cancel
              </button>
            `:''}
            ${order.status==='confirmed'?`
              <button class="action-btn btn-ready" onclick="updateOrderStatus('${order.id}','preparing')">
                <i class="fas fa-fire"></i> Start Preparing
              </button>
              <button class="action-btn btn-cancel" onclick="cancelOrder('${order.id}')">
                <i class="fas fa-times"></i> Cancel
              </button>
            `:''}
            ${order.status==='preparing'?`
              <button class="action-btn btn-complete" onclick="updateOrderStatus('${order.id}','ready')">
                <i class="fas fa-check-circle"></i> Ready
              </button>
            `:''}
            ${order.status==='ready'?`
              <button class="action-btn btn-complete" onclick="updateOrderStatus('${order.id}','delivered')">
                <i class="fas fa-check-double"></i> Completed
              </button>
            `:''}
          </div>
        </div>
      `;
    }
    
    // Toggle view more
    function toggleViewMore(orderId,totalItems){
      const itemsDiv=document.getElementById(`items_${orderId}`);
      const notesDiv=document.getElementById(`notes_${orderId}`);
      const viewMoreText=document.getElementById(`viewMoreText_${orderId}`);
      const viewMoreIcon=document.getElementById(`viewMoreIcon_${orderId}`);
      const card=document.getElementById(`card_${orderId}`);
      
      if(itemsDiv.classList.contains('expanded')){
        itemsDiv.classList.remove('expanded');
        notesDiv.classList.remove('show');
        viewMoreText.textContent=`View ${totalItems-3} more items`;
        viewMoreIcon.classList.remove('expanded');
        card.classList.remove('expanded');
      }else{
        loadAllItems(orderId);
        itemsDiv.classList.add('expanded');
        notesDiv.classList.add('show');
        viewMoreText.textContent='Show less';
        viewMoreIcon.classList.add('expanded');
        card.classList.add('expanded');
      }
    }
    
    // Load all items
    function loadAllItems(orderId){
      db.ref(`orders/${orderId}`).once('value').then((snapshot)=>{
        const order=snapshot.val();
        if(order){
          const itemsDiv=document.getElementById(`items_${orderId}`);
          itemsDiv.innerHTML=order.items.map(item=>`
            <div class="order-item">
              <span class="item-qty">${item.quantity}</span>
              <span class="item-name">${item.name}</span>
              <span class="item-price">€${item.price.toFixed(2)}</span>
            </div>
          `).join('');
        }
      });
    }
    
    // Show new order modal
    function showNewOrderModal(orderId,order){
      currentNewOrderId=orderId;
      document.getElementById('newOrderNumber').textContent=orderId.replace('order_','');
      document.getElementById('newOrderCustomer').textContent=order.customer.name;
      document.getElementById('newOrderItems').textContent=order.items.map(i=>`${i.quantity}x ${i.name}`).join(', ');
      document.getElementById('newOrderTotal').textContent='€'+order.total.toFixed(2);
      document.getElementById('newOrderModal').classList.add('show');
      
      // Play notification sound
      playNotificationSound();
    }
    
    // Accept new order
    function acceptNewOrder(){
      const modal=document.getElementById('newOrderModal');
      modal.classList.remove('show');
      
      db.ref(`orders/${currentNewOrderId}`).once('value').then((snapshot)=>{
        const order=snapshot.val();
        if(order&&order.preorder){
          updateOrderStatus(currentNewOrderId,'confirmed');
        }else{
          openTimeModal(currentNewOrderId);
        }
      });
    }
    
    // Open time modal
    function openTimeModal(orderId){
      currentNewOrderId=orderId;
      selectedTime=15;
      document.querySelectorAll('.time-option').forEach(opt=>opt.classList.remove('selected'));
      document.querySelector('.time-option').classList.add('selected');
      document.getElementById('customTimeInput').value='';
      document.getElementById('timeModal').classList.add('show');
    }
    
    // Select time
    function selectTime(time){
      selectedTime=time;
      document.querySelectorAll('.time-option').forEach(opt=>opt.classList.remove('selected'));
      event.target.closest('.time-option').classList.add('selected');
      document.getElementById('customTimeInput').value='';
    }
    
    // Validate custom time
    function validateCustomTime(){
      const input=document.getElementById('customTimeInput');
      const value=parseInt(input.value);
      if(value>0&&value<=60){
        selectedTime=value;
        document.querySelectorAll('.time-option').forEach(opt=>opt.classList.remove('selected'));
      }
    }
    
    // Close time modal
    function closeTimeModal(){
      document.getElementById('timeModal').classList.remove('show');
    }
    
    // Confirm time
    function confirmTime(){
      const customTime=parseInt(document.getElementById('customTimeInput').value);
      if(customTime>0&&customTime<=60){
        selectedTime=customTime;
      }
      
      db.ref(`orders/${currentNewOrderId}`).update({
        status:'confirmed',
        estimatedTime:selectedTime,
        estimatedSetAt:Date.now()
      }).then(()=>{
        closeTimeModal();
        showToast(`Order accepted! Estimated time: ${selectedTime} minutes`);
        loadOrders();
      }).catch((error)=>{
        showToast('Failed to accept order',true);
        console.error(error);
      });
    }
    
    // Update order status
    function updateOrderStatus(orderId,status){
      db.ref(`orders/${orderId}`).update({status}).then(()=>{
        showToast(`Order status updated to ${status}`);
        loadOrders();
      }).catch((error)=>{
        showToast('Failed to update status',true);
        console.error(error);
      });
    }
    
    // Cancel order
    function cancelOrder(orderId){
      if(confirm('Are you sure you want to cancel this order?')){
        db.ref(`orders/${orderId}`).update({status:'rejected'}).then(()=>{
          showToast('Order cancelled');
          loadOrders();
        }).catch((error)=>{
          showToast('Failed to cancel order',true);
          console.error(error);
        });
      }
    }
    
    // Play notification sound
    function playNotificationSound(){
      const audio=new Audio('https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3');
      audio.play().catch(()=>{});
    }
    
    // Show toast
    function showToast(msg,isError=false){
      const toast=document.getElementById('toast');
      toast.querySelector('i').className=isError?'fas fa-exclamation-circle':'fas fa-check-circle';
      toast.querySelector('span').textContent=msg;
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'),3000);
    }
  </script>
</body>
</html>
