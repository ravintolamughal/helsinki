<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Orders - Mughal Restaurant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --purple:#4c00b0;--purple-dark:#36007d;--purple-deep:#25005a;--purple-mid:#6a1ec8;
      --purple-light:#f0e8ff;--gold:#f5c842;--gold-dark:#c9a227;--white:#ffffff;
      --cream:#f9f5ff;--text:#2a2a2a;--text-light:#666;--border:#e2d5f5;
      --shadow:rgba(76,0,176,0.18);--r:18px;--t:all 0.38s cubic-bezier(.4,0,.2,1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;color:var(--text);background:linear-gradient(135deg,var(--purple-deep),var(--purple),var(--purple-mid));min-height:100vh;overflow-x:hidden}
    
    /* Navbar */
    .navbar{background:rgba(37,0,90,.95);backdrop-filter:blur(20px);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
    .nav-logo{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--gold)}
    .nav-links{display:flex;gap:20px}
    .nav-links a{color:rgba(255,255,255,.85);text-decoration:none;font-size:.9rem;transition:.3s}
    .nav-links a:hover{color:var(--gold)}
.nav-refresh-btn{padding:10px 20px;background:rgba(245,200,66,.2);color:var(--gold);border:1px solid var(--gold);border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;transition:var(--t);font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:6px}
.nav-refresh-btn:hover{background:var(--gold);color:var(--purple-deep);transform:translateY(-2px)}
.nav-refresh-btn:active{transform:scale(.95)}
    
    /* Container */
    .container{max-width:1600px;margin:0 auto;padding:24px;display:flex;gap:24px}
    
    /* Sidebar */
    .sidebar{width:250px;flex-shrink:0}
    .sidebar-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--gold);margin-bottom:20px}
    .sidebar-tabs{display:flex;flex-direction:column;gap:8px}
    .sidebar-tab{padding:16px 20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:rgba(255,255,255,.7);font-size:.95rem;font-weight:600;cursor:pointer;transition:.3s;text-align:left;font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:12px}
    .sidebar-tab:hover{background:rgba(255,255,255,.1);color:var(--white)}
    .sidebar-tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);border-color:var(--gold)}
    .sidebar-tab i{width:20px;text-align:center}
    .tab-badge{margin-left:auto;background:rgba(0,0,0,.2);padding:2px 8px;border-radius:10px;font-size:.8rem}
    
    /* Main Content */
    .main-content{flex:1}
    .section-title{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--gold);margin-bottom:24px}
    .section-subtitle{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:600;color:rgba(255,255,255,.9);margin-bottom:16px;display:flex;align-items:center;gap:10px}
    .section-subtitle i{color:var(--gold)}
    .section-badge{background:var(--gold);color:var(--purple-deep);padding:4px 12px;border-radius:20px;font-size:.85rem;font-weight:700;margin-left:auto}
    .order-section{margin-bottom:40px}
    .orders-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    
    @media(max-width:1400px){
      .orders-grid{grid-template-columns:repeat(3,1fr)}
    }
    @media(max-width:1100px){
      .container{flex-direction:column}
      .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding-bottom:10px}
      .sidebar-tabs{flex-direction:row;flex-wrap:nowrap}
      .sidebar-tab{flex-shrink:0}
      .orders-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:768px){
      .orders-grid{grid-template-columns:1fr}
    }
    
    /* Order Card */
    .order-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:16px;transition:var(--t);min-height:280px;display:flex;flex-direction:column;overflow:hidden}
    .order-card.new-order{border:2px solid var(--gold);background:rgba(245,200,66,.08);box-shadow:0 0 20px rgba(245,200,66,.3);animation:orderPulse 1.5s ease-in-out infinite}
    @keyframes orderPulse{
      0%,100%{transform:scale(1);box-shadow:0 0 20px rgba(245,200,66,.3)}
      50%{transform:scale(1.02);box-shadow:0 0 30px rgba(245,200,66,.5)}
    }
    .order-card.preorder{border:2px solid #3b82f6;background:rgba(59,130,246,.08)}
    .order-card:hover{transform:translateY(-2px)}
    .order-card.expanded{min-height:auto}

    /* Order Card Header */
    .card-header{background:rgba(0,0,0,.2);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.1)}
    .header-left{display:flex;flex-direction:column;gap:4px}
    .order-number{font-size:1.1rem;font-weight:800;color:var(--gold);font-family:'Poppins',sans-serif;letter-spacing:0.5px}
    .order-time{font-size:.7rem;color:rgba(255,255,255,.5)}
    .order-status-badge{padding:6px 12px;border-radius:20px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
    .order-status-badge.pending{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep)}
    .order-status-badge.confirmed{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
    .order-status-badge.preparing{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
    .order-status-badge.ready{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
    .order-status-badge.delivered{background:linear-gradient(135deg,#6b7280,#4b5563);color:#fff}
    .order-status-badge.rejected{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}

    /* Order Card Body */
    .card-body{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}

    /* Customer Info */
    .customer-info{background:rgba(255,255,255,.03);border-radius:10px;padding:10px}
    .customer-name{font-size:.9rem;font-weight:600;color:var(--white);margin-bottom:4px}
    .customer-contact{font-size:.75rem;color:rgba(255,255,255,.5);margin-bottom:2px;display:flex;align-items:center;gap:6px}
    .customer-contact i{color:var(--gold);width:12px}
    
    /* Preorder Badge */
    .preorder-badge{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;padding:4px 10px;border-radius:6px;font-size:.7rem;font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}
    .preorder-badge i{font-size:.8rem}
    .preorder-time{font-size:.75rem;color:#3b82f6;font-weight:600;margin-top:2px}
    
    /* Order Items */
    .order-items{flex:1;background:rgba(255,255,255,.02);border-radius:10px;padding:10px}
    .order-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
    .order-item:last-child{border-bottom:none}
    .item-qty{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex-shrink:0}
    .item-name{flex:1;font-size:.8rem;color:var(--white);font-weight:500}
    .item-price{font-size:.8rem;color:var(--gold);font-weight:600}

    /* Card Footer */
    .card-footer{background:rgba(0,0,0,.3);padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:12px}
    .order-total{display:flex;justify-content:space-between;align-items:center}
    .total-label{font-size:.85rem;color:rgba(255,255,255,.7);font-weight:500}
    .total-amount{font-size:1.3rem;color:var(--gold);font-weight:800;font-family:'Poppins',sans-serif}
    .order-actions{display:flex;gap:6px}
    .action-btn{flex:1;padding:8px;border-radius:8px;font-size:.7rem;font-weight:600;cursor:pointer;transition:.3s;border:none;display:flex;align-items:center;justify-content:center;gap:4px;font-family:'Poppins',sans-serif}
    
    /* View More */
    .view-more{color:var(--gold);font-size:.85rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;margin-top:8px;transition:.3s}
    .view-more:hover{color:var(--gold-dark)}
    .view-more i{transition:.3s}
    .view-more.expanded i{transform:rotate(180deg)}
    
    /* Order Notes */
    .order-notes{background:rgba(255,255,255,.05);border-radius:8px;padding:12px;margin-top:12px;display:none}
    .order-notes.show{display:block}
    .note-item{font-size:.8rem;color:rgba(255,255,255,.7);margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.05)}
    .note-item:last-child{border-bottom:none}
    .note-item strong{color:var(--gold)}
    
    /* Order Total */
    .order-total{display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);font-weight:600;color:var(--white)}
    .total-label{font-size:.9rem}
    .total-amount{font-size:1.1rem;color:var(--gold)}
    
    /* Order Actions */
    .order-actions{display:flex;gap:6px;margin-top:12px}
    .action-btn{flex:1;padding:10px;border-radius:8px;font-size:.75rem;font-weight:600;cursor:pointer;transition:.3s;border:none;display:flex;align-items:center;justify-content:center;gap:4px;font-family:'Poppins',sans-serif}
    .btn-accept{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
    .btn-accept:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(34,197,94,.3)}
    .btn-ready{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
    .btn-ready:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(59,130,246,.3)}
    .btn-complete{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
    .btn-complete:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(245,158,11,.3)}
    .btn-cancel{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
    .btn-cancel:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(239,68,68,.3)}
    .btn-view{background:rgba(255,255,255,.1);color:var(--white);border:1px solid rgba(255,255,255,.2)}
    .btn-view:hover{background:rgba(255,255,255,.15);border-color:var(--gold)}
    
    /* New Order Notification */
    .new-order-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
    .new-order-modal.show{display:flex;animation:slideIn 0.5s ease}
    @keyframes slideIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
    .new-order-content{background:linear-gradient(135deg,var(--purple-deep),var(--purple));backdrop-filter:blur(20px);border:3px solid var(--gold);border-radius:24px;padding:50px;max-width:600px;width:100%;text-align:center;box-shadow:0 0 60px rgba(245,200,66,.5),0 0 100px rgba(245,200,66,.3);animation:modalPulse 2s ease-in-out infinite}
    @keyframes modalPulse{0%,100%{box-shadow:0 0 60px rgba(245,200,66,.5),0 0 100px rgba(245,200,66,.3)}50%{box-shadow:0 0 80px rgba(245,200,66,.7),0 0 120px rgba(245,200,66,.5)}}
    .new-order-icon{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;color:var(--purple-deep);font-size:3rem;margin:0 auto 24px;animation:pulse 1.5s infinite;box-shadow:0 0 30px rgba(245,200,66,.6)}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
    .new-order-title{font-family:'Playfair Display',serif;font-size:2.5rem;font-weight:700;color:var(--gold);margin-bottom:8px;text-shadow:0 2px 10px rgba(245,200,66,.3)}
    .new-order-text{color:rgba(255,255,255,.9);font-size:1.3rem;margin-bottom:30px;font-weight:500}
    .new-order-details{background:rgba(255,255,255,.08);border:2px solid rgba(245,200,66,.3);border-radius:16px;padding:24px;margin-bottom:30px;text-align:left}
    .new-order-details p{color:rgba(255,255,255,.9);margin-bottom:12px;font-size:1.05rem;line-height:1.6}
    .new-order-details strong{color:var(--gold);font-weight:700}
    .new-order-btn{padding:20px 50px;background:linear-gradient(135deg,#22c55e,#16a34a);border:none;border-radius:16px;color:#fff;font-size:1.3rem;font-weight:700;cursor:pointer;transition:.3s;font-family:'Poppins',sans-serif;box-shadow:0 8px 25px rgba(34,197,94,.4)}
    .new-order-btn:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(34,197,94,.6)}
    
    /* Time Selection Modal */
    .time-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9998;display:none;align-items:center;justify-content:center;padding:20px}
    .time-modal.show{display:flex}
    .time-modal-content{background:linear-gradient(135deg,var(--purple-deep),var(--purple));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;max-width:450px;width:100%}
    .time-modal-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--gold);margin-bottom:20px;text-align:center}
    .time-options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
    .time-option{padding:16px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15);border-radius:12px;text-align:center;cursor:pointer;transition:.3s}
    .time-option:hover{border-color:var(--gold);background:rgba(245,200,66,.1)}
    .time-option.selected{border-color:var(--gold);background:rgba(245,200,66,.15)}
    .time-option span{display:block;color:var(--white);font-weight:600;font-size:1.1rem}
    .time-option small{color:rgba(255,255,255,.5);font-size:.8rem;margin-top:4px;display:block}
    .custom-time{display:flex;gap:8px;margin-bottom:24px}
    .custom-time input{flex:1;padding:12px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15);border-radius:10px;color:var(--white);font-size:1rem;text-align:center;font-family:'Poppins',sans-serif}
    .custom-time input:focus{border-color:var(--gold);outline:none}
    .time-modal-actions{display:flex;gap:12px}
    .time-modal-btn{flex:1;padding:14px;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.3s;border:none;font-family:'Poppins',sans-serif}
    .btn-cancel{background:rgba(255,255,255,.1);color:var(--white)}
    .btn-confirm{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
    .btn-confirm:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(34,197,94,.3)}
    
    /* Toast */
    .toast{position:fixed;top:30px;right:30px;z-index:99999;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:13px 20px;border-radius:14px;font-size:.85rem;font-weight:600;box-shadow:0 12px 38px rgba(34,197,94,.4);opacity:0;transform:translateX(18px);transition:all .42s cubic-bezier(.4,0,.2,1);pointer-events:none;max-width:300px}
    .toast.show{opacity:1;transform:translateX(0);pointer-events:all}
    .toast.error{background:linear-gradient(135deg,#c0392b,#e74c3c);box-shadow:0 12px 38px rgba(239,68,68,.4)}
    
    /* Empty State */
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.5)}
    .empty-state i{font-size:4rem;margin-bottom:16px;opacity:.5}
    .empty-state p{font-size:1rem}
    
    @media(max-width:768px){
      .orders-grid{grid-template-columns:1fr}
      .navbar{padding:12px 20px}
      .time-options{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-logo">Mughal Admin</div>
    <div class="nav-links">
      <a href="menusetup.html">Menu Setup</a>
      <a href="adminorders.html" style="color:var(--gold)">Orders</a>
      <a href="index.html">View Site</a>
      <button class="nav-refresh-btn" onclick="manualRefresh()">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>
  </nav>
  
  <!-- Container -->
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h2 class="sidebar-title">Orders</h2>
      <div class="sidebar-tabs">
        <div class="sidebar-tab active" onclick="toggleSection('active')" id="tab-active">
          <i class="fas fa-fire"></i>
          Active Orders
          <span class="tab-badge" id="activeBadge">0</span>
        </div>
        <div class="sidebar-tab" onclick="toggleSection('delivered')" id="tab-delivered">
          <i class="fas fa-check-double"></i>
          Completed
          <span class="tab-badge" id="deliveredBadge">0</span>
        </div>
        <div class="sidebar-tab" onclick="toggleSection('rejected')" id="tab-rejected">
          <i class="fas fa-times-circle"></i>
          Cancelled
          <span class="tab-badge" id="rejectedBadge">0</span>
        </div>
      </div>
      <div class="date-toggle" style="margin-top:20px">
        <button onclick="toggleDateSelector()" id="dateToggleBtn" style="width:100%;padding:12px;background:rgba(245,200,66,.2);border:1px solid var(--gold);border-radius:12px;color:var(--gold);font-size:.9rem;font-weight:600;cursor:pointer;transition:.3s;font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px">
          <i class="fas fa-calendar"></i> Select Date
        </button>
        <div id="dateSelectorPanel" style="margin-top:12px;padding:16px;background:rgba(255,255,255,.05);border-radius:12px;display:none">
          <label style="color:rgba(255,255,255,.7);font-size:.85rem;font-weight:600;margin-bottom:8px;display:block">Select Date</label>
          <input type="date" id="dateSelector" class="date-input" style="width:100%;padding:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:.9rem;font-family:'Poppins',sans-serif" onchange="selectDate()"/>
          <button onclick="resetToToday()" style="width:100%;margin-top:8px;padding:10px;background:rgba(245,200,66,.2);border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:.85rem;font-weight:600;cursor:pointer;transition:.3s;font-family:'Poppins',sans-serif">Today</button>
        </div>
      </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
      <h2 class="section-title" id="sectionTitle">Active Orders</h2>
      <div class="orders-grid" id="ordersContainer">
        <div class="empty-state">
          <i class="fas fa-inbox"></i>
          <p>No orders</p>
        </div>
      </div>
    </div>
  </div>
  
  <!-- New Order Notification Modal -->
  <div class="new-order-modal" id="newOrderModal">
    <div class="new-order-content">
      <div class="new-order-icon"><i class="fas fa-bell"></i></div>
      <h2 class="new-order-title">New Order!</h2>
      <p class="new-order-text">Order #<span id="newOrderNumber"></span> has arrived</p>
      <div class="new-order-details">
        <p><strong>Customer:</strong> <span id="newOrderCustomer"></span></p>
        <p><strong>Items:</strong> <span id="newOrderItems"></span></p>
        <p><strong>Total:</strong> <span id="newOrderTotal"></span></p>
      </div>
      <button class="new-order-btn" onclick="acceptNewOrder()">Accept Order</button>
    </div>
  </div>
  
  <!-- Time Selection Modal -->
  <div class="time-modal" id="timeModal">
    <div class="time-modal-content">
      <h3 class="time-modal-title">Select Preparation Time</h3>
      <div class="time-options">
        <div class="time-option selected" onclick="selectTime(15)">
          <span>15</span>
          <small>minutes</small>
        </div>
        <div class="time-option" onclick="selectTime(25)">
          <span>25</span>
          <small>minutes</small>
        </div>
        <div class="time-option" onclick="selectTime(35)">
          <span>35</span>
          <small>minutes</small>
        </div>
        <div class="time-option" onclick="selectTime(45)">
          <span>45</span>
          <small>minutes</small>
        </div>
        <div class="time-option" onclick="selectTime(60)">
          <span>60</span>
          <small>minutes</small>
        </div>
      </div>
      <div class="custom-time">
        <input type="number" id="customTimeInput" placeholder="Or enter minutes (max 60)" min="1" max="60" oninput="validateCustomTime()"/>
      </div>
      <div class="time-modal-actions">
        <button class="time-modal-btn btn-cancel" onclick="closeTimeModal()">Cancel</button>
        <button class="time-modal-btn btn-confirm" onclick="confirmTime()">Confirm</button>
      </div>
    </div>
  </div>
  
  <!-- Toast -->
  <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Success!</span></div>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    // Firebase Config
    const firebaseConfig={
      apiKey:"AIzaSyAmimDsjW_pF2NGw-w-40QzTsgmf1tdqyI",
      authDomain:"bdmsalonappointment.firebaseapp.com",
      databaseURL:"https://bdmsalonappointment-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:"bdmsalonappointment",
      storageBucket:"bdmsalonappointment.firebasestorage.app",
      messagingSenderId:"123933913893",
      appId:"1:123933913893:web:c1f57caf4dc2a5440ba0cc"
    };
    firebase.initializeApp(firebaseConfig);
    const db=firebase.database();
    
    let currentNewOrderId=null;
    let selectedTime=15;
    let ordersRef=null;
    let processedOrders=new Set();
    let currentSection='active';
    let notificationInterval=null;
    let currentDate=new Date().toDateString();
    let selectedDate=new Date();
    
    // Listen for orders
    document.addEventListener('DOMContentLoaded',()=>{
      loadOrders();
      ordersRef=db.ref('orders').on('value',(snapshot)=>{
        const data=snapshot.val();
        if(data){
          Object.entries(data).forEach(([id,order])=>{
            if(order.status==='pending'&&!processedOrders.has(id)){
              showNewOrderModal(id,order);
              processedOrders.add(id);
              startNotificationSound();
            }
          });
          processOrders(data);
        }else{
          document.getElementById('ordersContainer').innerHTML='<div class="empty-state"><i class="fas fa-inbox"></i><p>No orders</p></div>';
          updateBadges({});
        }
      });
      
      // Check for date change every minute
      setInterval(checkDateChange,60000);
    });
    
    // Process orders from real-time data
    function processOrders(data){
      const filterDate=new Date(selectedDate);
      filterDate.setHours(0,0,0,0);

      const ordersByStatus={
        pending:[],
        confirmed:[],
        preparing:[],
        ready:[],
        delivered:[],
        rejected:[]
      };

      Object.entries(data).forEach(([id,order])=>{
        const orderDate=new Date(order.timestamp||Date.now());
        orderDate.setHours(0,0,0,0);

        if(orderDate.getTime()===filterDate.getTime()){
          if(ordersByStatus[order.status]){
            ordersByStatus[order.status].push({id,...order});
          }
        }
      });

      Object.keys(ordersByStatus).forEach(status=>{
        ordersByStatus[status].sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
      });

      updateBadges(ordersByStatus);

      let ordersToShow=[];
      if(currentSection==='active'){
        ordersToShow=[...ordersByStatus.pending,...ordersByStatus.confirmed,...ordersByStatus.preparing,...ordersByStatus.ready];
      }else if(currentSection==='delivered'){
        ordersToShow=ordersByStatus.delivered;
      }else if(currentSection==='rejected'){
        ordersToShow=ordersByStatus.rejected;
      }

      ordersToShow.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
      renderOrders(ordersToShow);
    }
    
    // Check if date has changed
    function checkDateChange(){
      const today=new Date().toDateString();
      if(today!==currentDate){
        currentDate=today;
        if(selectedDate.toDateString()===today){
          loadOrders();
        }
      }
    }

    // Select custom date
    function selectDate(){
      const dateInput=document.getElementById('dateSelector');
      if(dateInput.value){
        selectedDate=new Date(dateInput.value);
        loadOrders();
        showToast(`Showing orders for ${selectedDate.toLocaleDateString()}`);
      }
    }

    // Reset to today
    function resetToToday(){
      selectedDate=new Date();
      document.getElementById('dateSelector').value='';
      loadOrders();
      showToast('Showing today\'s orders');
    }
    
    // Manual refresh
    function manualRefresh(){
      currentDate=new Date().toDateString();
      loadOrders();
      showToast('Orders refreshed');
    }
    
    // Toggle section
    function toggleSection(section){
      currentSection=section;
      document.querySelectorAll('.sidebar-tab').forEach(t=>t.classList.remove('active'));
      document.getElementById(`tab-${section}`).classList.add('active');

      const titles={
        active:'Active Orders',
        delivered:'Completed Orders',
        rejected:'Cancelled Orders'
      };
      document.getElementById('sectionTitle').textContent=titles[section];

      loadOrders();
    }

    // Toggle date selector
    function toggleDateSelector(){
      const panel=document.getElementById('dateSelectorPanel');
      panel.style.display=panel.style.display==='none'?'block':'none';
    }
    
    // Start repeating notification sound
    function startNotificationSound(){
      stopNotificationSound();
      notificationInterval=setInterval(()=>{
        const audio=new Audio('https://assets.mixkit.co/sfx/preview/mixkit-positive-notification-951.mp3');
        audio.play().catch(()=>{});
      },3000);
    }

// Play single notification sound
    function playNotificationSound(){
      const audio=new Audio('https://assets.mixkit.co/sfx/preview/mixkit-positive-notification-951.mp3');
      audio.play().catch(()=>{});
    }
    
    // Stop notification sound
    function stopNotificationSound(){
      if(notificationInterval){
        clearInterval(notificationInterval);
        notificationInterval=null;
      }
    }
    
    // Load orders
    function loadOrders(){
      console.log('Loading orders from Firebase...');
      db.ref('orders').once('value').then((snapshot)=>{
        const data=snapshot.val();
        console.log('Orders data:', data);
        if(!data){
          updateBadges({});
          renderOrders([]);
          return;
        }

        const filterDate=new Date(selectedDate);
        filterDate.setHours(0,0,0,0);

        const ordersByStatus={
          pending:[],
          confirmed:[],
          preparing:[],
          ready:[],
          delivered:[],
          rejected:[]
        };

        Object.entries(data).forEach(([id,order])=>{
          const orderDate=new Date(order.timestamp||Date.now());
          orderDate.setHours(0,0,0,0);

          // Only show selected date's orders
          if(orderDate.getTime()===filterDate.getTime()){
            if(ordersByStatus[order.status]){
              ordersByStatus[order.status].push({id,...order});
            }
          }
        });

        // Sort orders by timestamp
        Object.keys(ordersByStatus).forEach(status=>{
          ordersByStatus[status].sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
        });

        updateBadges(ordersByStatus);

        let ordersToShow=[];
        if(currentSection==='active'){
          ordersToShow=[...ordersByStatus.pending,...ordersByStatus.confirmed,...ordersByStatus.preparing,...ordersByStatus.ready];
        }else if(currentSection==='delivered'){
          ordersToShow=ordersByStatus.delivered;
        }else if(currentSection==='rejected'){
          ordersToShow=ordersByStatus.rejected;
        }

        ordersToShow.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
        renderOrders(ordersToShow);
      });
    }
    
    // Update badges
    function updateBadges(ordersByStatus){
      const activeCount=(ordersByStatus.pending?.length||0)+(ordersByStatus.confirmed?.length||0)+(ordersByStatus.preparing?.length||0)+(ordersByStatus.ready?.length||0);
      document.getElementById('activeBadge').textContent=activeCount;
      document.getElementById('deliveredBadge').textContent=ordersByStatus.delivered?.length||0;
      document.getElementById('rejectedBadge').textContent=ordersByStatus.rejected?.length||0;
    }

    // Render orders
    function renderOrders(orders){
      const container=document.getElementById('ordersContainer');
      console.log('Rendering orders:', orders);
      if(!orders||orders.length===0){
        container.innerHTML='<div class="empty-state"><i class="fas fa-inbox"></i><p>No orders</p></div>';
        return;
      }

      try{
        const cardsHtml=orders.map(order=>createOrderCard(order)).join('');
        console.log('Cards HTML generated:', cardsHtml.substring(0,200));
        container.innerHTML=cardsHtml;
      }catch(error){
        console.error('Error rendering orders:', error);
        container.innerHTML='<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading orders</p></div>';
      }
    }
    
    // Create order card
    function createOrderCard(order){
      console.log('Creating card for order:', order);
      if(!order||!order.items||!order.customer){
        console.error('Invalid order data:', order);
        return '';
      }

      const itemsToShow=order.items.slice(0,3);
      const hasMoreItems=order.items.length>3;
      const isPreorder=order.preorder;
      const numericId=order.id.replace(/\D/g,'')||'1';
      const orderId='ORD'+numericId.padStart(4,'0');
      const orderDate=new Date(order.timestamp||Date.now());
      
      return `
        <div class="order-card ${order.status==='pending'?'new-order':''} ${isPreorder?'preorder':''}" id="card_${order.id}">
          <div class="card-header">
            <div class="header-left">
              <span class="order-number">#${orderId}</span>
              <span class="order-time">${orderDate.toLocaleDateString()} ${orderDate.toLocaleTimeString()}</span>
            </div>
            <span class="order-status-badge ${order.status}">${order.status.charAt(0).toUpperCase()+order.status.slice(1)}</span>
          </div>
          
          <div class="card-body">
            ${isPreorder?`
              <div class="preorder-badge">
                <i class="fas fa-clock"></i> Preorder
              </div>
              <p class="preorder-time"><i class="fas fa-calendar"></i> Pickup: ${order.pickupTime}</p>
            `:''}
            
            <div class="customer-info">
              <p class="customer-name">${order.customer.name}</p>
              <p class="customer-contact"><i class="fas fa-phone"></i> ${order.customer.phone}</p>
              <p class="customer-contact"><i class="fas fa-envelope"></i> ${order.customer.email}</p>
            </div>
            
            <div class="order-items" id="items_${order.id}">
              ${itemsToShow.map(item=>`
                <div class="order-item">
                  <span class="item-qty">${item.quantity}</span>
                  <span class="item-name">${item.name}</span>
                  <span class="item-price">€${item.price.toFixed(2)}</span>
                </div>
              `).join('')}
            </div>
            
            ${hasMoreItems?`
              <div class="view-more" onclick="toggleViewMore('${order.id}',${order.items.length})">
                <span id="viewMoreText_${order.id}">View ${order.items.length-3} more items</span>
                <i class="fas fa-chevron-down" id="viewMoreIcon_${order.id}"></i>
              </div>
            `:''}
            
            <div class="order-notes" id="notes_${order.id}">
              ${order.items.map(item=>`
                ${item.note?`<div class="note-item"><strong>${item.name}:</strong> ${item.note}</div>`:''}
              `).join('')}
            </div>
          </div>
          
          <div class="card-footer">
            <div class="order-total">
              <span class="total-label">Total</span>
              <span class="total-amount">€${order.total.toFixed(2)}</span>
            </div>
            <div class="order-actions">
              ${order.status==='pending'?`
                <button class="action-btn btn-accept" onclick="openTimeModal('${order.id}')">
                  <i class="fas fa-check"></i> Accept
                </button>
                <button class="action-btn btn-cancel" onclick="cancelOrder('${order.id}')">
                  <i class="fas fa-times"></i> Cancel
                </button>
              `:''}
              ${order.status==='confirmed'||order.status==='preparing'?`
                <button class="action-btn btn-ready" onclick="updateOrderStatus('${order.id}','ready')">
                  <i class="fas fa-check-circle"></i> Ready
                </button>
                <button class="action-btn btn-cancel" onclick="cancelOrder('${order.id}')">
                  <i class="fas fa-times"></i> Cancel
                </button>
              `:''}
              ${order.status==='ready'?`
                <button class="action-btn btn-complete" onclick="updateOrderStatus('${order.id}','delivered')">
                  <i class="fas fa-check-double"></i> Completed
                </button>
              `:''}
            </div>
          </div>
        </div>
      `;
    }
    
    // Toggle view more
    function toggleViewMore(orderId,totalItems){
      const itemsDiv=document.getElementById(`items_${orderId}`);
      const notesDiv=document.getElementById(`notes_${orderId}`);
      const viewMoreText=document.getElementById(`viewMoreText_${orderId}`);
      const viewMoreIcon=document.getElementById(`viewMoreIcon_${orderId}`);
      const card=document.getElementById(`card_${orderId}`);
      
      if(itemsDiv.classList.contains('expanded')){
        itemsDiv.classList.remove('expanded');
        notesDiv.classList.remove('show');
        viewMoreText.textContent=`View ${totalItems-3} more items`;
        viewMoreIcon.classList.remove('expanded');
        card.classList.remove('expanded');
      }else{
        loadAllItems(orderId);
        itemsDiv.classList.add('expanded');
        notesDiv.classList.add('show');
        viewMoreText.textContent='Show less';
        viewMoreIcon.classList.add('expanded');
        card.classList.add('expanded');
      }
    }
    
    // Load all items
    function loadAllItems(orderId){
      db.ref(`orders/${orderId}`).once('value').then((snapshot)=>{
        const order=snapshot.val();
        if(order){
          const itemsDiv=document.getElementById(`items_${orderId}`);
          itemsDiv.innerHTML=order.items.map(item=>`
            <div class="order-item">
              <span class="item-qty">${item.quantity}</span>
              <span class="item-name">${item.name}</span>
              <span class="item-price">€${item.price.toFixed(2)}</span>
            </div>
          `).join('');
        }
      });
    }
    
    // Show new order modal
    function showNewOrderModal(orderId,order){
      currentNewOrderId=orderId;
      const numericId=orderId.replace(/\D/g,'')||'1';
      const formattedId='ORD'+numericId.padStart(4,'0');
      document.getElementById('newOrderNumber').textContent=formattedId;
      document.getElementById('newOrderCustomer').textContent=order.customer.name;
      document.getElementById('newOrderItems').textContent=order.items.map(i=>`${i.quantity}x ${i.name}`).join(', ');
      document.getElementById('newOrderTotal').textContent='€'+order.total.toFixed(2);
      document.getElementById('newOrderModal').classList.add('show');

      // Play notification sound
      playNotificationSound();
    }
    
    // Accept new order
    function acceptNewOrder(){
      const modal=document.getElementById('newOrderModal');
      modal.classList.remove('show');
      stopNotificationSound();
      
      db.ref(`orders/${currentNewOrderId}`).once('value').then((snapshot)=>{
        const order=snapshot.val();
        if(order&&order.preorder){
          updateOrderStatus(currentNewOrderId,'confirmed');
        }else{
          openTimeModal(currentNewOrderId);
        }
      });
    }
    
    // Open time modal
    function openTimeModal(orderId){
      currentNewOrderId=orderId;
      selectedTime=15;
      document.querySelectorAll('.time-option').forEach(opt=>opt.classList.remove('selected'));
      document.querySelector('.time-option').classList.add('selected');
      document.getElementById('customTimeInput').value='';
      document.getElementById('timeModal').classList.add('show');
    }
    
    // Select time
    function selectTime(time){
      selectedTime=time;
      document.querySelectorAll('.time-option').forEach(opt=>opt.classList.remove('selected'));
      event.target.closest('.time-option').classList.add('selected');
      document.getElementById('customTimeInput').value='';
    }
    
    // Validate custom time
    function validateCustomTime(){
      const input=document.getElementById('customTimeInput');
      const value=parseInt(input.value);
      if(value>0&&value<=60){
        selectedTime=value;
        document.querySelectorAll('.time-option').forEach(opt=>opt.classList.remove('selected'));
      }
    }
    
    // Close time modal
    function closeTimeModal(){
      document.getElementById('timeModal').classList.remove('show');
    }
    
    // Confirm time
    function confirmTime(){
      const customTime=parseInt(document.getElementById('customTimeInput').value);
      if(customTime>0&&customTime<=60){
        selectedTime=customTime;
      }
      
      db.ref(`orders/${currentNewOrderId}`).update({
        status:'confirmed',
        estimatedTime:selectedTime,
        estimatedSetAt:Date.now()
      }).then(()=>{
        closeTimeModal();
        showToast(`Order accepted! Estimated time: ${selectedTime} minutes`);
        loadOrders();
      }).catch((error)=>{
        showToast('Failed to accept order',true);
        console.error(error);
      });
    }
    
    // Update order status
    function updateOrderStatus(orderId,status){
      db.ref(`orders/${orderId}`).update({status}).then(()=>{
        showToast(`Order status updated to ${status}`);
        loadOrders();
      }).catch((error)=>{
        showToast('Failed to update status',true);
        console.error(error);
      });
    }
    
    // Cancel order
    function cancelOrder(orderId){
      if(confirm('Are you sure you want to cancel this order?')){
        db.ref(`orders/${orderId}`).update({status:'rejected'}).then(()=>{
          showToast('Order cancelled');
          loadOrders();
        }).catch((error)=>{
          showToast('Failed to cancel order',true);
          console.error(error);
        });
      }
    }
    
    // Play notification sound
    function playNotificationSound(){
      const audio=new Audio('https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3');
      audio.play().catch(()=>{});
    }
    
    // Show toast
    function showToast(msg,isError=false){
      const toast=document.getElementById('toast');
      toast.querySelector('i').className=isError?'fas fa-exclamation-circle':'fas fa-check-circle';
      toast.querySelector('span').textContent=msg;
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'),3000);
    }
  </script>
</body>
</html>
