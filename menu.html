<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Full Menu — RAVINTOLA MUGHAL</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
/* ── ROOT (exact from index.html) ── */
:root{
  --purple:#4c00b0;--purple-dark:#36007d;--purple-deep:#25005a;--purple-mid:#6a1ec8;
  --purple-light:#f0e8ff;--gold:#f5c842;--gold-dark:#c9a227;--white:#ffffff;
  --cream:#f9f5ff;--text:#2a2a2a;--text-light:#666;--border:#e2d5f5;
  --shadow:rgba(76,0,176,0.18);--r:18px;--t:all 0.38s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:'Poppins',sans-serif;color:var(--text);background:linear-gradient(180deg,var(--purple-deep) 0%,#160040 100%);overflow-x:hidden;padding-top:80px}
@media(max-width:768px){body{padding-top:60px}}
a{text-decoration:none;color:inherit}
ul{list-style:none}
img{display:block;width:100%;object-fit:cover}
.container{max-width:1200px;margin:0 auto;padding:0 28px}
@media(max-width:768px){.container{padding:0 16px}}

/* ── BUTTONS (exact from index.html) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 28px;border-radius:50px;font-size:.88rem;font-weight:600;cursor:pointer;transition:var(--t);border:2px solid transparent;white-space:nowrap;font-family:'Poppins',sans-serif;min-height:44px;text-decoration:none}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);border-color:var(--gold);font-weight:700}
.btn-gold:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(245,200,66,.42)}
.btn-outline-white{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.6);backdrop-filter:blur(6px)}
.btn-outline-white:hover{background:#fff;color:var(--purple-deep);transform:translateY(-3px)}
.btn-sm{padding:9px 20px;font-size:.8rem;min-height:40px}

/* ── NAVBAR (exact from index.html) ── */
#navbar{position:fixed;top:0;left:0;right:0;z-index:1000;padding:14px 36px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;transition:var(--t);background:rgba(37,0,90,.96);backdrop-filter:blur(15px)}
#navbar.scrolled{background:rgba(37,0,90,0.97);box-shadow:0 4px 32px rgba(0,0,0,.38)}
.nav-logo img{height:54px;width:auto;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.3))}
.nav-links{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.nav-links a{color:rgba(255,255,255,.92);font-size:.85rem;font-weight:500;transition:var(--t);position:relative;white-space:nowrap;padding:8px 16px;border-radius:30px}
.nav-links a:hover{color:var(--gold);background:rgba(245,200,66,0.15)}
.nav-links a.active{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);font-weight:700;padding:10px 24px}
.nav-right{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-shrink:0}
.order-now-btn{padding:8px 18px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);border:1.5px solid var(--gold);border-radius:50px;font-size:.78rem;font-weight:700;cursor:pointer;transition:var(--t);white-space:nowrap}
.order-now-btn:hover{transform:scale(1.05);box-shadow:0 4px 12px rgba(245,200,66,.4)}
.hamburger{display:flex;color:#fff;font-size:1.4rem;cursor:pointer;background:linear-gradient(135deg,rgba(255,255,255,0.15),rgba(255,255,255,0.1));border:1.5px solid rgba(255,255,255,0.25);border-radius:10px;width:42px;height:42px;align-items:center;justify-content:center;flex-shrink:0;transition:var(--t)}
.hamburger:hover{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);border-color:var(--gold)}
@media(max-width:768px){.nav-links{display:none}}

/* ── DRAWER (exact from index.html) ── */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:998;backdrop-filter:blur(4px)}
.drawer-overlay.open{display:block}
.nav-drawer{position:fixed;top:0;right:0;bottom:0;width:320px;max-width:85vw;background:var(--purple-deep);z-index:999;transform:translateX(110%);transition:transform .42s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.4)}
.nav-drawer.open{transform:translateX(0)}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.18);flex-shrink:0}
.drawer-logo{height:45px;width:auto;object-fit:contain}
.drawer-close{color:#fff;font-size:1.3rem;cursor:pointer;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;transition:var(--t);flex-shrink:0}
.drawer-close:hover{background:var(--gold);color:var(--purple-deep);border-color:var(--gold);transform:rotate(90deg)}
.drawer-nav{display:flex;flex-direction:column;padding:10px 0;flex:1}
.drawer-nav a{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.82);font-size:.92rem;font-weight:500;padding:13px 20px;border-bottom:1px solid rgba(255,255,255,.05);transition:all .3s;text-decoration:none}
.drawer-nav a:hover{color:var(--gold);background:rgba(255,255,255,.05);padding-left:26px}
.drawer-nav a.active{color:var(--gold);background:rgba(245,200,66,.08)}
.drawer-nav a i{color:var(--gold);width:18px;text-align:center;flex-shrink:0;font-size:.9rem}
.drawer-bottom{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:9px}
.drawer-cta-btns{display:flex;flex-direction:column;gap:8px}
.drawer-cta-btns .btn{font-size:.82rem;padding:11px 16px;justify-content:center;min-height:42px}

/* ── HERO BANNER ── */
.menu-hero{background:linear-gradient(180deg,var(--purple-deep) 0%,#160040 100%);padding:48px 0 36px;text-align:center}
@media(max-width:768px){.menu-hero{padding:32px 0 24px}}
.menu-hero .sec-label{display:block;font-size:.72rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.menu-hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,4vw,2.6rem);color:#fff;line-height:1.2;margin-bottom:14px}
.menu-hero h1 span{color:var(--gold)}
.menu-hero p{font-size:.9rem;color:rgba(255,255,255,.55);line-height:1.7;max-width:500px;margin:0 auto}
@media(max-width:768px){.menu-hero p{font-size:.82rem}}

/* ── MENU SECTION (exact same as index.html) ── */
.menu-section{background:transparent;padding:0 0 60px}
@media(max-width:768px){.menu-section{padding:0 0 40px}}
.tc{text-align:center}
.sec-label{display:block;font-size:.72rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.sec-title{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,4vw,2.85rem);color:#fff;line-height:1.2;margin-bottom:16px}
.sec-sub{font-size:.97rem;color:rgba(255,255,255,.55);line-height:1.85;margin-bottom:0;max-width:600px;margin-left:auto;margin-right:auto}

/* ── MENU LAYOUT ── */
.menu-layout{display:block;padding-top:8px}

/* ── HORIZONTAL CATEGORY SCROLL - SIMPLE PILLS ── */
.cat-sidebar{margin-bottom:24px}
.cat-sidebar-title{padding:10px 0;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
.cat-scroll-wrapper{position:relative}
.cat-sidebar-scroll{overflow-x:auto;overflow-y:hidden;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.cat-sidebar-scroll::-webkit-scrollbar{height:4px}
.cat-sidebar-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.cat-sidebar-btn{display:flex;align-items:center;padding:8px 18px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:50px;color:rgba(255,255,255,.7);font-size:.82rem;font-weight:600;cursor:pointer;transition:var(--t);font-family:'Poppins',sans-serif;white-space:nowrap;flex-shrink:0}
.cat-sidebar-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.cat-sidebar-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);border-color:transparent;box-shadow:0 4px 14px rgba(245,200,66,.35)}
.cat-sidebar-btn.hidden-cat{display:none}
.show-more-btn{padding:6px 16px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);border:1.5px solid var(--gold);border-radius:50px;font-size:.78rem;font-weight:700;cursor:pointer;transition:var(--t);font-family:'Poppins',sans-serif;white-space:nowrap;flex-shrink:0}
.show-more-btn:hover{transform:scale(1.05);box-shadow:0 4px 12px rgba(245,200,66,.4)}
@media(max-width:768px){.cat-sidebar-scroll{gap:6px}.cat-sidebar-btn{padding:6px 14px;font-size:.76rem}.show-more-btn{padding:5px 12px;font-size:.72rem}}

/* ── MENU GRID (exact from index.html) ── */
.menu-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:22px}
.menu-grid.active{display:grid}
@media(max-width:768px){.menu-grid{grid-template-columns:1fr;gap:12px}}
@media(min-width:769px) and (max-width:1024px){.menu-grid{grid-template-columns:repeat(2,1fr);gap:18px}}

/* ── CARDS (exact from index.html) ── */
.m-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;overflow:hidden;transition:var(--t)}
.m-card:hover{transform:translateY(-7px);box-shadow:0 26px 56px rgba(0,0,0,.38);border-color:rgba(245,200,66,.28)}
.m-img{position:relative;height:200px;overflow:hidden}
.m-img img{width:100%;height:100%;object-fit:cover;transition:transform .55s ease}
.m-card:hover .m-img img{transform:scale(1.09)}
.m-spice{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:var(--gold);padding:4px 10px;border-radius:20px;font-size:.67rem;font-weight:700;backdrop-filter:blur(6px)}
.m-body{padding:16px}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;gap:8px}
.m-head h3{font-size:.94rem;color:#fff;font-weight:600;line-height:1.3;flex:1;min-width:0}
.m-price{font-family:'Playfair Display',serif;font-size:1.12rem;font-weight:700;color:var(--gold);flex-shrink:0}
.m-body p{font-size:.79rem;color:rgba(255,255,255,.5);line-height:1.65;margin-bottom:11px}
.m-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:.67rem;font-weight:700}
.veg{background:rgba(74,222,128,.12);color:#4ade80}
.nonveg{background:rgba(248,113,113,.1);color:#f87171}
@media(max-width:768px){
  .m-img{height:160px}
  .m-body{padding:12px}
  .m-head h3{font-size:.88rem}
  .m-price{font-size:1rem}
  .m-body p{font-size:.75rem}
}

/* ── CATEGORY DIVIDER ── */
.cat-divider{margin:44px 0 24px}
.cat-divider h2{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--gold);border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:12px;display:flex;align-items:center;gap:12px}
.cat-divider h2::before{content:'';display:inline-block;width:4px;height:22px;background:var(--gold);border-radius:2px;flex-shrink:0}

/* ── SKELETON ── */
.skeleton-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:22px}
@media(max-width:768px){.skeleton-grid{grid-template-columns:1fr;gap:16px}}
.skeleton-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;overflow:hidden}
.skeleton-img{height:200px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.skeleton-body{padding:16px}
.skeleton-line{height:12px;border-radius:4px;margin-bottom:8px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.skeleton-line.short{width:45%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:80px 20px}
.empty-state i{font-size:3.5rem;color:rgba(255,255,255,.15);margin-bottom:20px}
.empty-state h3{font-family:'Playfair Display',serif;color:var(--gold);margin-bottom:8px;font-size:1.4rem}
.empty-state p{color:rgba(255,255,255,.4);font-size:.9rem}

/* ── FOOTER ── */
.mini-footer{background:var(--purple-deep);color:rgba(255,255,255,.5);text-align:center;padding:20px 16px;font-size:.8rem;border-top:1px solid rgba(255,255,255,.1)}
.mini-footer a{color:var(--gold);text-decoration:none}
.mini-footer a:hover{text-decoration:underline}
@media(max-width:768px){.mini-footer{padding:16px 12px;font-size:.75rem}}

/* ── SCROLL TO TOP ── */
.scroll-top-btn{position:fixed;left:20px;bottom:24px;width:44px;height:44px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;transition:var(--t);opacity:0;pointer-events:none;transform:translateY(10px);z-index:999;box-shadow:0 4px 14px rgba(245,200,66,.3)}
.scroll-top-btn.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.scroll-top-btn:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(245,200,66,.5)}
@media(max-width:768px){.scroll-top-btn{left:14px;bottom:18px;width:40px;height:40px;font-size:1rem}}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
/* ── FIREBASE ── */
firebase.initializeApp({
  apiKey:"AIzaSyAmimDsjW_pF2NGw-w-40QzTsgmf1tdqyI",
  authDomain:"bdmsalonappointment.firebaseapp.com",
  databaseURL:"https://bdmsalonappointment-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"bdmsalonappointment",
  storageBucket:"bdmsalonappointment.firebasestorage.app",
  messagingSenderId:"123933913893",
  appId:"1:123933913893:web:c1f57caf4dc2a5440ba0cc"
});
const db=firebase.database();

const DEFAULT_IMG='https://davidbantu1999.github.io/mughal-restaurant/logo.png';
let allItems=[],allCategories=[],menuData={};
let currentTab='all';
let showAllCategories=false;

function getSpiceLabel(s){return{'"No Spice"':'No Spice','Mild':'🌶 Mild','Medium':'🌶🌶 Medium','Hot':'🌶🌶🌶 Hot'}[s]||s}

function cardHTML(item){
  const img=item.image&&item.image.trim()&&item.image!==DEFAULT_IMG?item.image:DEFAULT_IMG;
  return`<div class="m-card">
    <div class="m-img">
      <img src="${img}" alt="${item.name}" onerror="this.src='${DEFAULT_IMG}'" loading="lazy"/>
      <span class="m-spice">${getSpiceLabel(item.spice||'')}</span>
    </div>
    <div class="m-body">
      <div class="m-head">
        <h3>${item.name}</h3>
        <span class="m-price">€${parseFloat(item.price||0).toFixed(2)}</span>
      </div>
      <p>${item.description||''}</p>
      <span class="m-badge ${item.type||'veg'}">${item.type==='nonveg'?'● Non-Veg':'● Vegetarian'}</span>
    </div>
  </div>`;
}

function renderMenu(){
  const content=document.getElementById('menuContent');
  const filtered=currentTab==='all'?allItems:allItems.filter(i=>i.category===currentTab);
  if(!filtered.length){
    content.innerHTML=`<div class="empty-state"><i class="fas fa-utensils"></i><h3>No items yet</h3><p>Use the Menu Editor to add items.</p></div>`;
    return;
  }
  if(currentTab==='all'){
    let html='';
    allCategories.forEach(cat=>{
      const catItems=filtered.filter(i=>i.category===cat);
      if(!catItems.length)return;
      html+=`<div class="cat-divider"><h2>${cat}</h2></div>
        <div class="menu-grid active">${catItems.map(cardHTML).join('')}</div>`;
    });
    content.innerHTML=html;
  } else {
    content.innerHTML=`<div class="menu-grid active">${filtered.map(cardHTML).join('')}</div>`;
  }
}

function buildTabs(){
  const tabs=document.getElementById('menuTabs');
  tabs.innerHTML='';
  const allBtn=document.createElement('button');
  allBtn.className='cat-sidebar-btn'+(currentTab==='all'?' active':'');
  allBtn.textContent='All Items';
  allBtn.onclick=function(){switchTab('all',this);};
  tabs.appendChild(allBtn);
  allCategories.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='cat-sidebar-btn'+(currentTab===c?' active':'');
    btn.textContent=c;
    btn.onclick=function(){switchTab(c,this);};
    if(!showAllCategories&&i>=6){
      btn.classList.add('hidden-cat');
    }
    tabs.appendChild(btn);
  });
  updateShowMoreButton();
}

function toggleCategories(){
  showAllCategories=!showAllCategories;
  const tabs=document.getElementById('menuTabs');
  const btns=tabs.querySelectorAll('.cat-sidebar-btn');
  btns.forEach((btn,i)=>{
    if(i>0){
      btn.classList.toggle('hidden-cat',!showAllCategories&&i>=6);
    }
  });
  updateShowMoreButton();
}

function updateShowMoreButton(){
  const btn=document.getElementById('showMoreBtn');
  if(allCategories.length<=6){
    btn.style.display='none';
  }else{
    btn.style.display='block';
    btn.textContent=showAllCategories?'Show Less':'Show More';
  }
}

function switchTab(cat,btn){
  currentTab=cat;
  document.querySelectorAll('.cat-sidebar-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderMenu();
  setTimeout(()=>{
    const content=document.getElementById('menuContent');
    if(content){
      content.scrollIntoView({behavior:'smooth',block:'start'});
    }
  },100);
}

/* ── NAVBAR SCROLL ── */
window.addEventListener('scroll',()=>{
  document.getElementById('navbar').classList.toggle('scrolled',scrollY>40);
  const scrollTopBtn=document.getElementById('scrollTopBtn');
  if(scrollTopBtn){
    scrollTopBtn.classList.toggle('show',scrollY>300);
  }
});

/* ── SCROLL TO TOP ── */
function scrollToTop(){
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── COMING SOON NOTIFICATION ── */
function showComingSoon(){
  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;top:80px;right:24px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--purple-deep);padding:14px 24px;border-radius:12px;font-weight:700;font-size:.9rem;z-index:10000;box-shadow:0 8px 24px rgba(245,200,66,.4);opacity:0;transform:translateY(-10px);transition:all .3s';
  toast.textContent='🚀 Coming Soon!';
  document.body.appendChild(toast);
  setTimeout(()=>{toast.style.opacity='1';toast.style.transform='translateY(0)';},50);
  setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translateY(-10px)';setTimeout(()=>toast.remove(),300);},2500);
}

/* ── DRAWER ── */
const hamburger=document.getElementById('hamburger');
const navDrawer=document.getElementById('navDrawer');
const drawerOverlay=document.getElementById('drawerOverlay');
const drawerClose=document.getElementById('drawerClose');
function openDrawer(){navDrawer.classList.add('open');drawerOverlay.classList.add('open');document.body.style.overflow='hidden';}
function closeDrawer(){navDrawer.classList.remove('open');drawerOverlay.classList.remove('open');document.body.style.overflow='';}
hamburger.addEventListener('click',openDrawer);
drawerClose.addEventListener('click',closeDrawer);
drawerOverlay.addEventListener('click',closeDrawer);

/* ── SKELETON ── */
document.getElementById('skeletonGrid').innerHTML=Array(6).fill(0).map(()=>`<div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>`).join('');

/* ── FIREBASE LOAD ── */
db.ref('menu').on('value',snapshot=>{
  const sk=document.getElementById('skeletonGrid');
  if(sk)sk.remove();
  const data=snapshot.val();
  console.log('Firebase data:',data);
  if(!data){
    document.getElementById('menuContent').innerHTML=`<div class="empty-state"><i class="fas fa-utensils"></i><h3>Menu coming soon!</h3><p>We're preparing something delicious.</p></div>`;
    return;
  }
  allCategories=data.categories||[];
  allItems=Object.entries(data.items||{}).map(([id,item])=>({...item,id}));
  console.log('Categories:',allCategories);
  console.log('Items:',allItems);
  buildTabs();
  renderMenu();
},error=>{
  console.error('Firebase error:',error);
  const sk=document.getElementById('skeletonGrid');
  if(sk)sk.remove();
  document.getElementById('menuContent').innerHTML=`<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error loading menu</h3><p>Please try refreshing the page.</p></div>`;
});
</script>
</body>
</html>
