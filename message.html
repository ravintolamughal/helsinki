<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVINTOLA MUGHAL - Messages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0d0d0d;
            --fg: #fff;
            --card-bg: #181818;
            --accent: #1a73e8;
            --accent-light: #64b5f6;
            --border: #333;
            --muted: #90caf9;
            --input-bg: #232323;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 0;
        }
        
        .restaurant-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 1.5px;
        }
        
        .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }
        
        .messages-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .messages-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--fg);
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, var(--accent), #1565c0);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.4);
        }
        
        .messages-container {
            display: grid;
            gap: 16px;
        }
        
        .message-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
        }
        
        .message-card:hover {
            border-color: var(--accent);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .sender-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .sender-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-light);
        }
        
        .sender-phone {
            font-size: 0.9rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .message-time {
            font-size: 0.8rem;
            color: var(--muted);
        }
        
        .message-content {
            margin-bottom: 15px;
            line-height: 1.6;
            color: var(--fg);
        }
        
        .message-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        
        .call-btn {
            background: linear-gradient(135deg, #43ea7a 0%, #205c26 100%);
            color: #fff;
        }
        
        .call-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(67, 234, 122, 0.4);
        }
        
        .delete-btn {
            background: linear-gradient(135deg, #ff3d3d 0%, #992424 100%);
            color: #fff;
        }
        
        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 61, 61, 0.4);
        }
        
        .no-messages {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        
        .no-messages i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .no-messages p {
            font-size: 1.2rem;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        
        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 650px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .restaurant-title {
                font-size: 1.4rem;
            }
            
            .messages-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .message-card {
                padding: 16px;
            }
            
            .message-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .message-actions {
                flex-direction: column;
            }
            
            .action-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="restaurant-title">RAVINTOLA MUGHAL</h1>
            <a href="index.html" class="back-btn">
                <i class="fa fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
        
        <div class="messages-header">
            <h2 class="messages-title">Contact Messages</h2>
            <button class="refresh-btn" id="refresh-btn">
                <i class="fa fa-sync-alt"></i> Refresh
            </button>
        </div>
        
        <div class="messages-container" id="messages-container">
            <div class="loading">
                <i class="fa fa-spinner"></i>
                <p>Loading messages...</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAS1EqTC1E5IkxHyavOsdYEyhvSVBaa7YY",
          authDomain: "restaurant-30ee9.firebaseapp.com",
          databaseURL: "https://restaurant-30ee9-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "restaurant-30ee9",
          storageBucket: "restaurant-30ee9.firebasestorage.app",
          messagingSenderId: "774659563524",
          appId: "1:774659563524:web:f9fb1f7cf830ab22879551",
          measurementId: "G-81147GM14S"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let messages = [];

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="no-messages">
                        <i class="fa fa-inbox"></i>
                        <p>No messages yet</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            const sortedMessages = [...messages].sort((a, b) => b.timestamp - a.timestamp);
            
            sortedMessages.forEach(msg => {
                const card = document.createElement('div');
                card.className = 'message-card';
                card.innerHTML = `
                    <div class="message-header">
                        <div class="sender-info">
                            <div class="sender-name">${escapeHtml(msg.name)}</div>
                            <div class="sender-phone">
                                <i class="fa fa-phone"></i> ${escapeHtml(msg.phone)}
                            </div>
                        </div>
                        <div class="message-time">${formatTimestamp(msg.timestamp)}</div>
                    </div>
                    <div class="message-content">
                        ${escapeHtml(msg.message)}
                    </div>
                    <div class="message-actions">
                        <a href="tel:${msg.phone}" class="action-btn call-btn">
                            <i class="fa fa-phone"></i> Call
                        </a>
                        <button class="action-btn delete-btn" data-id="${msg.id}">
                            <i class="fa fa-trash"></i> Delete
                        </button>
                    </div>
                `;
                
                card.querySelector('.delete-btn').addEventListener('click', function() {
                    const msgId = this.dataset.id;
                    if (confirm('Are you sure you want to delete this message?')) {
                        db.ref('contact-messages/' + msgId).remove()
                            .then(() => {
                                messages = messages.filter(m => m.id !== msgId);
                                renderMessages();
                            })
                            .catch(() => {
                                alert('Failed to delete message');
                            });
                    }
                });
                
                container.appendChild(card);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function loadMessages() {
            db.ref('contact-messages').on('value', function(snapshot) {
                const data = snapshot.val();
                messages = [];
                
                if (data) {
                    Object.keys(data).forEach(key => {
                        messages.push({
                            id: key,
                            ...data[key]
                        });
                    });
                }
                
                renderMessages();
            });
        }

        document.getElementById('refresh-btn').addEventListener('click', function() {
            this.innerHTML = '<i class="fa fa-sync-alt fa-spin"></i> Refreshing...';
            setTimeout(() => {
                this.innerHTML = '<i class="fa fa-sync-alt"></i> Refresh';
            }, 500);
        });

        loadMessages();
    </script>
</body>
</html>
